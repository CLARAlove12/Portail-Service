
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faire une demande de service | Portail étudiant</title>
    <meta name="description" content="Effectuez une demande de service depuis le portail étudiant.">
    <meta property="og:title" content="Faire une demande de service">
    <meta property="og:description" content="Effectuez une demande de service depuis le portail étudiant.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="../img/og-image.jpg">
</head>

<body>

    <div id="header"></div>

    <main id="contenu">
        <h1>Faire une demande de service</h1>

        <p>Les champs marqués d'un astérisque (*) sont obligatoires.</p>

        <form action="./espace.html" method="GET">

            <fieldset>
                <legend>Vos coordonnées</legend>

                <div>
                    <label for="nom">Nom *</label>
                    <input
                        type="text"
                        id="nom"
                        name="nom"
                        autocomplete="family-name"
                        required
                        aria-describedby="nom-err"
                    >
                    <p id="nom-err"></p>
                </div>

                <div>
                    <label for="prenom">Prénom *</label>
                    <input
                        type="text"
                        id="prenom"
                        name="prenom"
                        autocomplete="given-name"
                        required
                        aria-describedby="prenom-err"
                    >
                    <p id="prenom-err"></p>
                </div>

                <div>
                    <label for="email">Adresse e-mail *</label>
                    <p id="email-aide">
                        Exemple : nom@domaine.fr
                    </p>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        required
                        aria-describedby="email-aide email-err"
                    >
                    <p id="email-err"></p>
                </div>

                <div>
                    <label for="ville">Ville</label>
                    <input
                        type="text"
                        id="ville"
                        name="ville"
                        autocomplete="address-level2"
                        aria-describedby="ville-err"
                    >
                    <p id="ville-err"></p>
                </div>
            </fieldset>

            <fieldset>
                <legend>Votre demande</legend>

                <div>
                    <label for="service">Service demandé *</label>
                    <select
                        id="service"
                        name="service"
                        required
                        aria-describedby="service-err"
                    >
                        <option value="">Choisissez un service</option>
                        <option value="10">Accompagnement garantie locative</option>
                        <option value="8">Aide à la recherche de logement</option>
                        <option value="14">Aide d'urgence</option>
                        <option value="9">Colocation étudiante</option>
                        <option value="4">Impression grand format</option>
                        <option value="11">Inscription au sport universitaire</option>
                        <option value="15">Job étudiant sur le campus</option>
                        <option value="2">Prêt de caméra</option>
                        <option value="1">Prêt de matériel</option>
                        <option value="3">Prêt d'ordinateur portable</option>
                        <option value="12">Prêt de vélo</option>
                        <option value="16">Rendez-vous médecin</option>
                        <option value="5">Réservation de salle</option>
                        <option value="13">Salle de musculation</option>
                        <option value="7">Salle de projet</option>
                        <option value="17">Soutien psychologique</option>
                        <option value="6">Studio d'enregistrement</option>
                    </select>
                    <p id="service-err"></p>
                </div>

                <div>
                    <label for="date">Date souhaitée *</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                        aria-describedby="date-err"
                    >
                    <p id="date-err"></p>
                </div>

                <fieldset aria-describedby="creneau-err">
                    <legend>Créneau horaire souhaité *</legend>

                    <div>
                        <input
                            type="radio"
                            id="matin"
                            name="creneau"
                            value="matin"
                            required
                        >
                        <label for="matin">Matin</label>
                    </div>

                    <div>
                        <input
                            type="radio"
                            id="apres-midi"
                            name="creneau"
                            value="apres-midi"
                        >
                        <label for="apres-midi">Après-midi</label>
                    </div>

                    <p id="creneau-err"></p>
                </fieldset>

                <div>
                    <label for="commentaire">Commentaires</label>
                    <p id="commentaire-aide">
                        Vous pouvez ajouter des précisions sur votre demande (500 caractères maximum).
                    </p>
                    <textarea
                        id="commentaire"
                        name="commentaire"
                        maxlength="500"
                        aria-describedby="commentaire-aide commentaire-err"
                        placeholder="Exemple : Tournage d'un projet vidéo en groupe."
                    ></textarea>
                    <p id="commentaire-err"></p>
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="consentement"
                        name="consentement"
                        value="oui"
                        required
                        aria-describedby="consentement-err"
                    >
                    <label for="consentement">
                        J'accepte que mes coordonnées soient utilisées pour le traitement de ma demande *
                    </label>
                    <p id="consentement-err"></p>
                </div>
            </fieldset>

            <div>
                <button type="submit">Envoyer la demande</button>
                <a href="./services.html">Annuler</a>
            </div>

        </form>
    </main>

    <div id="footer"></div>

    <script type="module" src="../../src/main.js"></script>

</body>
</html>
